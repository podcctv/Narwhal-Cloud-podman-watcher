name: Build and Push GHCR Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            client/requirements.txt
            server/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r client/requirements.txt -r server/requirements.txt httpx==0.28.1

      - name: Audit Python dependency requirements
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: client/requirements.txt server/requirements.txt

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Audit all frontend dependencies and build
        working-directory: frontend
        run: |
          npm audit --audit-level=low
          npm run build

      - name: Install isolated Playwright runtime and Chromium
        run: |
          npm install --prefix tests/browser-runtime --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          tests/browser-runtime/node_modules/.bin/playwright install --with-deps chromium

      - name: Run synthetic localhost browser regressions
        env:
          NARWHAL_UI_OUTPUT_ROOT: ${{ runner.temp }}/narwhal-ui-regressions
          NODE_PATH: ${{ github.workspace }}/tests/browser-runtime/node_modules
        run: python tests/run_ui_regressions.py

      - name: Upload browser regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narwhal-ui-regressions
          path: ${{ runner.temp }}/narwhal-ui-regressions
          if-no-files-found: ignore
          retention-days: 7

      - name: Compile Python sources
        run: python -m compileall -q client server scripts tests

      - name: Run unit and Linux/OpenRC integration tests
        env:
          TCPING_TAIWAN_HOST: taiwan-target.invalid
        run: python -m unittest discover -s tests -v

      - name: Build and smoke-test server image
        run: |
          docker build --platform linux/amd64 \
            --build-arg APP_VERSION="$(tr -d '[:space:]' < VERSION)" \
            --build-arg APP_REVISION="$(git rev-parse HEAD)" \
            --tag narwhal-monitor-server-smoke:ci ./server
          docker run --rm --entrypoint python narwhal-monitor-server-smoke:ci \
            -c "import app, inbound_assessment"

      - name: Test isolated Linux packet admission (no host firewall changes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 libnetfilter-queue1
          sudo unshare --net --mount --fork --propagation private "$(command -v python)" tests/admission_linux_probe.py

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: podman-watcher-server
            dockerfile: ./server/Dockerfile
            context: ./server

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Require version bump for runtime changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- VERSION && \
             ! git diff --quiet HEAD^ HEAD -- client server scripts; then
            echo "Runtime or deployment files changed without updating VERSION." >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Read application version
        id: app-version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.app-version.outputs.version }}
            type=ref,event=tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
            APP_REVISION=${{ github.sha }}
