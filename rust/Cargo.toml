[workspace]
resolver = "2"
members = [
    "crates/proc-probe",
    "crates/socket-sec",
    "crates/cgroup-probe",
    "crates/host-metrics",
    "crates/geoip-probe",
    "crates/net-probe",
    "crates/narwhal-probe",
    "crates/transport",
    "crates/guard-core",
    "crates/runtime-drivers",
    "crates/net-guard",
    "crates/tc-guard",
    "crates/app-guard",
    "crates/agent-core",
]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
